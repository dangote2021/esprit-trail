name: Build Android .aab (TWA)

# Trigger manually from GitHub UI: Actions → Build Android .aab (TWA) → Run workflow
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g. 1.0.11)'
        required: true
        default: '1.0.11'
      versionCode:
        description: 'Version code (integer, must be > previous Play Store upload)'
        required: true
        default: '13'
      productionRelease:
        description: 'Enable pre-public-release fixes (orientation=any). Set to true for v1.0.9+ public launch.'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (skip JDK/SDK auto-install)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          # Symlink for bubblewrap's expected SDK structure
          if [ ! -d "${ANDROID_HOME}/tools" ]; then
            ln -sf "${ANDROID_HOME}/cmdline-tools/latest" "${ANDROID_HOME}/tools" || true
          fi

      - name: Decode signing keystore from secret
        run: |
          mkdir -p twa
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > twa/android.keystore
          ls -la twa/android.keystore
          # Verify keystore is valid
          keytool -list -keystore twa/android.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | head -3

      - name: Initialize Bubblewrap project
        working-directory: twa
        run: |
          # Pre-create twa-manifest.json so init uses our config
          yes "" | bubblewrap init \
            --manifest=https://esprit-trail.vercel.app/manifest.webmanifest \
            --directory=. \
            --skipPwaValidation || true
          ls -la

      - name: Patch twa-manifest.json (packageId, key alias, version)
        working-directory: twa
        env:
          PRODUCTION_RELEASE: ${{ inputs.productionRelease }}
        run: |
          # Override generated config with our required values
          python3 <<'PYEOF'
          import json, os
          with open('twa-manifest.json', 'r') as f:
              m = json.load(f)
          m['packageId'] = 'app.ravito'
          m['signingKey'] = {
              'path': os.path.abspath('android.keystore'),
              'alias': 'my-key-alias'
          }
          m['appVersionName'] = "${{ inputs.versionName }}"
          m['appVersionCode'] = int("${{ inputs.versionCode }}")
          m['appVersion'] = "${{ inputs.versionName }}"
          m['host'] = 'esprit-trail.vercel.app'
          m['name'] = 'Esprit Trail'
          m['launcherName'] = 'Esprit Trail'

          # Pre-public-release fixes (Play Console warnings)
          if os.environ.get('PRODUCTION_RELEASE') == 'true':
              # Fix Play Console warning #2 — orientation lock on large screens (Android 16+)
              # Allow rotation so tablets/foldables aren't forced into portrait.
              m['orientation'] = 'any'
              print('[PROD] Applied fix: orientation=any (large-screen warning)')

          with open('twa-manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
          print(json.dumps(m, indent=2))
          PYEOF

      - name: Regenerate Android project with patched manifest
        working-directory: twa
        run: |
          # Bubblewrap update regenerates gradle/AndroidManifest from twa-manifest.json
          printf "${{ inputs.versionName }}\n${{ inputs.versionCode }}\n" | bubblewrap update || true
          # Verify package ID is correctly written
          grep -r 'applicationId' app/build.gradle | head -3

      # NOTE (06/09/26): there used to be an "Apply pre-public-release Android
      # resource fixes" step here that patched app/src/main/res/values-v31/styles.xml
      # to opt out of Android 15's edge-to-edge enforcement, addressing a Play
      # Console warning. It was removed because it was broken at the root: it
      # declared <style name="Theme.LauncherActivity" parent="Theme.LauncherActivityBase">,
      # but Bubblewrap 1.25's generated project defines NO such app theme at all —
      # LauncherActivity has no android:theme override and inherits the
      # <application> tag's @android:style/Theme.Translucent.NoTitleBar directly.
      # AAPT failed with "resource style/Theme.LauncherActivityBase ... not found",
      # which broke every productionRelease build (verified via workflow run #2).
      # Re-adding this fix correctly would require: (1) adding
      # android:theme="@style/Theme.LauncherActivity" to the LauncherActivity tag
      # in the regenerated AndroidManifest.xml, (2) defining that style with
      # parent="@android:style/Theme.Translucent.NoTitleBar" in both
      # values/styles.xml and values-v31/styles.xml (the latter adding
      # android:windowOptOutEdgeToEdgeEnforcement), AND (3) bumping the installed
      # SDK platform + compileSdkVersion to 35+, since that attribute doesn't
      # exist in the android-34 platform installed above. That's a real Android
      # project change that deserves its own tested PR, not a blind CI patch —
      # so for now productionRelease only applies the orientation=any fix, which
      # is a plain twa-manifest.json field and known to work (see step above).

      - name: Harden Android project (R8 optimization, resource shrinking, androidbrowserhelper bump)
        working-directory: twa
        run: |
          # IMPORTANT (09/09/26) — Play Console pre-launch report warnings on v12/1.0.10:
          #
          # 1. "Améliorez la mémoire et les performances avec R8" — l'optimisation R8
          #    n'était pas activée. Confirmé en extrayant l'AAB réellement livré
          #    (BUNDLE-METADATA/com.android.tools/r8.json de esprit-trail-1.0.10.aab) :
          #    isShrinkingEnabled=true, isObfuscationEnabled=true, MAIS
          #    isOptimizationsEnabled=false. Cause : le template Bubblewrap 1.25.0 ne
          #    déclare AUCUN `proguardFiles` dans app/build.gradle (vérifié dans le
          #    package npm), donc R8 tourne avec un jeu de règles vide côté module ---
          #    seules les consumer-rules embarquées dans les dépendances (AAR) sont
          #    fusionnées, et l'une d'elles impose -dontoptimize. Fix : déclarer
          #    explicitement `proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'`
          #    (le fichier "optimize" plutôt que l'ancien fichier neutre) + activer
          #    `shrinkResources true` (l'autre point manquant du même avertissement).
          #
          # 2. "Empreinte mémoire" côté ressources — shrinkResources n'était pas actif
          #    non plus (même avertissement, deuxième volet) : couvert par le même fix.
          #
          # 3. androidbrowserhelper bump 2.6.2 -> 2.7.3 : Bubblewrap 1.25.0 code en dur
          #    la version stable 2.6.2 (packages/cli FeatureManager.js). La 2.7.3 est la
          #    dernière stable publiée (2.7.0 = support edge-to-edge du splash screen,
          #    2.7.1 = "resolved deprecations in launcher activity"). Pas un remplacement
          #    complet du 3e avertissement Play Console (usage d'API dépréciées
          #    Window.setStatusBarColor/setNavigationBarColor) : vérifié sur le code
          #    source amont (branche main du repo GoogleChrome/android-browser-helper)
          #    que WebViewFallbackActivity.onCreate() appelle TOUJOURS ces API Window
          #    dépréciées, même dans la dernière version. C'est un chemin de repli rare
          #    (utilisé seulement si aucun navigateur compatible Custom Tabs n'est
          #    installé sur l'appareil) et une limitation connue, non corrigée, de la
          #    librairie TWA de Google elle-même -- donc non actionnable côté app, et
          #    seulement un avertissement "Peut être utile", pas un blocage de
          #    publication. Le bump reste fait pour les autres correctifs/améliorations.
          #
          # NB (targetSdkVersion 36) : déjà résolu, aucune action ici. Le template
          # Bubblewrap 1.25.0 code en dur compileSdkVersion/targetSdkVersion=36 (upgrade
          # npm silencieux un jour avant la 1.0.10) -- confirmé en dumpant le manifeste
          # de l'AAB réellement livré (`bundletool dump manifest`) :
          # targetSdkVersion="36". L'avertissement Play Console "cible Android 15" ne
          # concerne donc pas ce build : c'est le statut de la track production, qui
          # tourne encore sur une version antérieure. Il suffit de publier 1.0.10 (ou
          # plus récent) sur la track production pour que Google Play recalcule le
          # statut de conformité.
          python3 <<'PYEOF'
          path = 'app/build.gradle'
          with open(path) as f:
              content = f.read()

          before = content
          content = content.replace(
              "implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'",
              "implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'",
          )
          assert content != before, "androidbrowserhelper dependency line not found — Bubblewrap template may have changed"

          before = content
          content = content.replace(
              "    buildTypes {\n        release {\n            minifyEnabled true\n        }\n    }\n",
              "    buildTypes {\n        release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n        }\n    }\n",
          )
          assert content != before, "release buildType block not found — Bubblewrap template may have changed"

          with open(path, 'w') as f:
              f.write(content)
          print("Patched app/build.gradle OK")
          PYEOF

          # proguardFiles above references app/proguard-rules.pro — Bubblewrap never
          # generates one. Left empty on purpose: androidbrowserhelper/androidx already
          # ship their own consumer-rules.txt (auto-merged by AGP), which is what kept
          # the app working even with zero app-level rules up to now.
          touch app/proguard-rules.pro

          echo "--- Verification ---"
          grep -n "androidbrowserhelper:androidbrowserhelper\|shrinkResources\|proguardFiles" app/build.gradle

      - name: Build .aab
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation
          ls -la app/build/outputs/bundle/release/

      - name: Sign .aab with jarsigner (Bubblewrap doesn't sign AAB by default)
        working-directory: twa
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "Signing: $AAB"
          jarsigner \
            -keystore android.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" my-key-alias
          # Verify signature
          jarsigner -verify "$AAB" && echo "✓ AAB signed correctly"

      - name: Locate built artifacts
        id: artifacts
        working-directory: twa
        run: |
          AAB=$(find . -name "*.aab" | head -1)
          APK=$(find . -name "*-release-signed.apk" | head -1)
          echo "Found AAB: $AAB"
          echo "Found APK: $APK"
          echo "aab_path=$AAB" >> $GITHUB_OUTPUT
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: esprit-trail-${{ inputs.versionName }}-aab
          path: twa/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed .apk artifact (optional, for sideload testing)
        uses: actions/upload-artifact@v4
        with:
          name: esprit-trail-${{ inputs.versionName }}-apk
          path: twa/**/*-release-signed.apk
          if-no-files-found: warn
          retention-days: 30
